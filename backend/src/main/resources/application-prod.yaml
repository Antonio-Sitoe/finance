# Perfil de produção: SPRING_PROFILES_ACTIVE=prod
spring:
  jpa:
    show-sql: false

auth:
  cookie:
    secure: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
