<app-page-header
  title="Contactos"
  description="Gira os contactos das empresas clientes e os seus dados de comunicação."
  [breadcrumbs]="[{ label: 'Sistema' }, { label: 'Contactos' }]"
>
  <button
    class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600 dark:bg-brand-500 dark:hover:bg-brand-600"
  >
    <span class="text-base leading-none">+</span>
    Novo Contacto
  </button>
</app-page-header>

<div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-4 md:gap-6">
  <app-card-stat
    icon="UsersGroupRoundedBold"
    title="Total"
    description="Total de contactos"
    value="0"
  />
  <app-card-stat
    icon="UserCheckRoundedBold"
    title="Média por empresa"
    description="Média de contactos por empresa"
    value="0"
  />
  <app-card-stat
    icon="UserBlockRoundedBold"
    title="Empresas com contactos"
    description="Número de empresas com ≥1 contacto"
    value="0"
  />
  <app-card-stat
    icon="BuildingsBold"
    title="Empresas sem contactos"
    description="Número de empresas sem contactos"
    value="0"
  />
</div>

<div class="w-full">
  <app-contacts-list-table />
</div>
