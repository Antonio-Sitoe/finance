<app-page-header
  title="Clientes"
  description="Gerencie o relacionamento comercial com seus clientes e parceiros."
  [breadcrumbs]="[{ label: 'Sistema' }, { label: 'Clientes' }]"
>
  <button
    (click)="openCreate()"
    class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600 dark:bg-brand-500 dark:hover:bg-brand-600"
  >
    <span class="text-base leading-none">+</span>
    Novo Cliente
  </button>
</app-page-header>

<div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-4 md:gap-6">
  <app-card-stat
    icon="UsersGroupRoundedBold"
    title="Total"
    description="Total de Clientes"
    [value]="(facade.rankingResumo()?.totalClientes ?? 0).toString()"
  />
  <app-card-stat
    icon="UserCheckRoundedBold"
    title="Normal"
    description="Clientes de 0 a 5"
    [value]="(facade.rankingResumo()?.clientesNormais ?? 0).toString()"
  />
  <app-card-stat
    icon="UserHandUpLineDuotone"
    title="Em crescimento"
    description="Clientes de 6 a 8"
    [value]="(facade.rankingResumo()?.clientesEmCrescimento ?? 0).toString()"
  />
  <app-card-stat
    icon="CrownMinimalisticBold"
    title="VIP"
    description="Clientes de 9 a 10"
    [value]="(facade.rankingResumo()?.clientesVip ?? 0).toString()"
  />
</div>

<div class="w-full">
  <app-costumers-list-table
    (editClick)="openEdit($event)"
    (detailClick)="openDetail($event)"
  />
</div>

@if (customerDrawer()) {
  <app-create-and-edit-costumer
    [open]="customerDrawer()"
    (openChange)="customerDrawer.set($event)"
    [customer]="selectedCustomer()"
  />
}

@if (detailDrawerOpen()) {
  <app-costumer-detail-drawer
    [open]="detailDrawerOpen()"
    [costumer]="selectedCustomer()"
    (openChange)="detailDrawerOpen.set($event)"
    (edit)="openEdit($event)"
  />
}
