<div class="space-y-6">
  <div
    class="flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between"
  >
    <div>
      <h1 class="text-title-sm font-bold text-gray-800 dark:text-white/90">
        Fluxo de Caixa
      </h1>
      <p class="mt-1 text-theme-sm text-gray-500 dark:text-gray-400">
        Análise detalhada da movimentação financeira diária.
      </p>
    </div>

    <app-cash-flow-period-filter
      [active]="facade.periodPreset()"
      [customDe]="customDe()"
      [customAte]="customAte()"
      [showCustom]="showCustomPicker()"
      (presetChange)="onPresetChange($event)"
      (customDeChange)="customDe.set($event)"
      (customAteChange)="customAte.set($event)"
      (applyCustom)="applyCustomRange()"
    />
  </div>

  @if (facade.loading()) {
    <div
      class="flex items-center justify-center rounded-2xl border border-gray-200 bg-white py-16 text-sm text-gray-500 dark:border-gray-800 dark:bg-white/[0.03] dark:text-gray-400"
    >
      A carregar fluxo de caixa...
    </div>
  } @else {
    <app-cash-flow-kpis />

    <app-cash-flow-tabs
      [active]="facade.activeTab()"
      [exportDisabled]="!facade.report()"
      (exportCsv)="facade.exportCsv()"
    />

    @if (facade.activeTab() === "fluxo-diario") {
      <div class="space-y-6">
        <app-cash-flow-daily-chart />
        <app-cash-flow-daily-table />
      </div>
    }
  }
</div>
