<div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
  <div>
    <h1 class="text-title-sm text-gray-800 dark:text-white/90 font-bold">
      Bom dia, {{ nomeDia + "," }}
    </h1>
    <p class="text-theme-sm text-gray-500 dark:text-gray-400 mt-1">
      {{ dataFormatada }}
    </p>
  </div>
  <button
    class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-theme-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] transition-colors"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="size-4"
    >
      <path
        d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"
      />
    </svg>
    Actualizar dados
  </button>
</div>

<div class="grid grid-cols-12 gap-4 md:gap-6">
  <div class="col-span-12 space-y-6 grid gap-4 md:gap-6">
    <app-cards-metrics
      [receitasVencidas]="receitasVencidas"
      [despesasVencidas]="despesasVencidas"
      [qtdLancamentosVencemHoje]="qtdLancamentosVencemHoje"
    />
  </div>
  <div class="col-span-12 space-y-6 xl:col-span-7">
    <div><app-monthly-evolution-chart /></div>
  </div>
  <div class="col-span-12 xl:col-span-5">
    <app-monthly-target />
  </div>
  <div class="col-span-12 mt-2">
    <app-dashboard-footer-actions />
  </div>
  <!--
  <div class="col-span-12">
    <app-statics-chart />
  </div>

  <div class="col-span-12 xl:col-span-5">
    <app-demographic-card />
  </div>

  <div class="col-span-12 xl:col-span-7">
    <app-recent-orders/>
  </div> -->
</div>
