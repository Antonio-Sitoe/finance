<div
  class="flex flex-col mb-4 sm:flex-row sm:items-end sm:justify-between gap-4"
>
  <div>
    <h1 class="text-title-sm text-gray-800 dark:text-white/90 font-bold">
      Bom dia, {{ displayDayName + "," }}
    </h1>
    <p class="text-theme-sm text-gray-500 dark:text-gray-400 mt-1">
      {{ formattedDate }}
    </p>
  </div>
  <button
    (click)="onRefresh()"
    [disabled]="refreshing"
    class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-theme-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 disabled:opacity-60 disabled:cursor-not-allowed dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] transition-colors"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="size-4"
      [class.animate-spin]="refreshing"
    >
      <path
        d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"
      />
    </svg>
    Actualizar dados
  </button>
</div>

<div class="grid grid-cols-12 gap-4 md:gap-6">
  <div class="col-span-12 space-y-6 grid gap-4 md:gap-6">
    <app-cards-metrics />
  </div>
  <div class="col-span-12 space-y-6 xl:col-span-7">
    <app-monthly-evolution-chart />
  </div>
  <div class="col-span-12 xl:col-span-5">
    <app-monthly-target />
  </div>
  <div class="col-span-12 mt-2">
    <app-dashboard-footer-actions />
  </div>
</div>
