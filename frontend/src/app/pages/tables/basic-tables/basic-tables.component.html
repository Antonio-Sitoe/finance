<app-page-header
  title="Tabelas"
  description="Exemplo de uso do componente DataTable."
  [breadcrumbs]="[{ label: 'Componentes' }, { label: 'Tabelas' }]"
/>

<app-datatable
  [columns]="columns"
  [data]="pagedRows"
  [rowTemplate]="demoRow"
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  [totalElements]="allRows.length"
  [rowsPerPage]="rowsPerPage"
  (nextPage)="nextPage()"
  (previousPage)="previousPage()"
/>

<ng-template #demoRow let-row>
  <tr class="hover:bg-gray-50 dark:hover:bg-white/[0.02]">
    <td class="px-5 py-3.5 text-sm font-medium text-gray-700 dark:text-gray-400">
      {{ row.id }}
    </td>
    <td class="px-5 py-3.5">
      <div class="flex items-center gap-3">
        <app-avatar-text [name]="row.user.name" />
        <div>
          <span class="block text-sm font-medium text-gray-700 dark:text-gray-300">{{ row.user.name }}</span>
          <span class="text-xs text-gray-500 dark:text-gray-400">{{ row.user.email }}</span>
        </div>
      </div>
    </td>
    <td class="px-5 py-3.5 text-sm text-gray-700 dark:text-gray-400">{{ row.product }}</td>
    <td class="px-5 py-3.5 text-right text-sm text-gray-700 dark:text-gray-400">{{ row.value }}</td>
    <td class="px-5 py-3.5 text-sm text-gray-500 dark:text-gray-400">{{ row.date }}</td>
    <td class="px-5 py-3.5 text-center">
      <app-badge variant="light" [color]="getBadgeColor(row.status)" size="sm">
        {{ row.status }}
      </app-badge>
    </td>
  </tr>
</ng-template>
