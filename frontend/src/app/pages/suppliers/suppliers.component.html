<app-page-header
  title="Fornecedores"
  description="Gestão centralizada de parceiros e conformidade institucional."
  [breadcrumbs]="[{ label: 'Sistema' }, { label: 'Fornecedores' }]"
>
  <button
    (click)="drawerOpen.set(true)"
    class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600 dark:bg-brand-500 dark:hover:bg-brand-600"
  >
    <span class="text-base leading-none">+</span>
    Novo Fornecedor
  </button>
</app-page-header>

<div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-4 md:gap-6">
  <app-card-stat
    icon="BuildingsBold"
    title="Total"
    description="Fornecedores registados"
    value="4"
  />
  <app-card-stat
    icon="UserCheckRoundedBold"
    title="Activos"
    description="Contratos activos"
    value="3"
  />
  <app-card-stat
    icon="UserBlockRoundedBold"
    title="Inactivos"
    description="Contratos suspensos"
    value="1"
  />
  <app-card-stat
    icon="ShieldUserBold"
    title="Alta Conformidade"
    description="Avaliação ≥ 8.0"
    value="2"
  />
</div>

<div class="w-full">
  <app-suppliers-list-table [drawerOpen]="drawerOpen" />
</div>
