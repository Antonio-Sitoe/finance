<app-page-header title="Meu Perfil" [breadcrumbs]="[{ label: 'Sistema' }, { label: 'Meu Perfil' }]" />

<div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6 items-start">

  <!-- Coluna Esquerda: Identity Card -->
  <div>
    <app-user-meta-card />
  </div>

  <!-- Coluna Direita -->
  <div class="space-y-5">

    <!-- Informação Pessoal -->
    <app-user-info-card />

    <!-- Morada -->
    <app-user-address-card />

    <!-- Segurança -->
    <div class="border border-gray-200 rounded-2xl dark:border-gray-800 overflow-hidden bg-white dark:bg-white/[0.03]">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-800">
        <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">Segurança</h4>
        <button class="flex items-center gap-2 px-4 py-2 rounded-lg bg-brand-500 text-white text-sm font-medium hover:bg-brand-600 transition-colors shadow-theme-xs">
          <svg class="fill-current w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.5C9.51472 1.5 7.5 3.51472 7.5 6V7.5H6C4.75736 7.5 3.75 8.50736 3.75 9.75V19.5C3.75 20.7426 4.75736 21.75 6 21.75H18C19.2426 21.75 20.25 20.7426 20.25 19.5V9.75C20.25 8.50736 19.2426 7.5 18 7.5H16.5V6C16.5 3.51472 14.4853 1.5 12 1.5ZM15 7.5V6C15 4.34315 13.6569 3 12 3C10.3431 3 9 4.34315 9 6V7.5H15ZM12 12C12.8284 12 13.5 12.6716 13.5 13.5C13.5 14.0183 13.2298 14.4753 12.8249 14.7452L13.3 17H10.7L11.1751 14.7452C10.7702 14.4753 10.5 14.0183 10.5 13.5C10.5 12.6716 11.1716 12 12 12Z" fill=""/>
          </svg>
          Alterar Password
        </button>
      </div>
      <div class="p-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-5">
          <!-- Password dots -->
          <div class="space-y-1.5">
            <p class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider">Password</p>
            <div class="flex items-center gap-3">
              <div class="flex gap-1.5">
                <span class="w-2 h-2 rounded-full bg-gray-800 dark:bg-white/80"></span>
                <span class="w-2 h-2 rounded-full bg-gray-800 dark:bg-white/80"></span>
                <span class="w-2 h-2 rounded-full bg-gray-800 dark:bg-white/80"></span>
                <span class="w-2 h-2 rounded-full bg-gray-800 dark:bg-white/80"></span>
                <span class="w-2 h-2 rounded-full bg-gray-800 dark:bg-white/80"></span>
                <span class="w-2 h-2 rounded-full bg-gray-800 dark:bg-white/80"></span>
                <span class="w-2 h-2 rounded-full bg-gray-800 dark:bg-white/80"></span>
                <span class="w-2 h-2 rounded-full bg-gray-800 dark:bg-white/80"></span>
              </div>
              <span class="text-xs text-gray-400 dark:text-gray-500">Última alteração: há 3 meses</span>
            </div>
          </div>

          <!-- 2FA badge -->
          <div class="flex items-center gap-3 bg-gray-50 dark:bg-white/[0.03] border border-gray-200 dark:border-gray-800 rounded-xl p-4">
            <div class="w-10 h-10 rounded-full bg-brand-500/10 flex items-center justify-center text-brand-600 dark:text-brand-400 shrink-0">
              <svg class="fill-current w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C8.13401 2 5 5.13401 5 9C5 11.3799 6.14864 13.4915 7.92871 14.8071C5.60879 15.7351 3.75 17.8156 3.75 20.5C3.75 20.9142 4.08579 21.25 4.5 21.25C4.91421 21.25 5.25 20.9142 5.25 20.5C5.25 18.1619 7.08579 16.25 9.5 16.25H14.5C16.9142 16.25 18.75 18.1619 18.75 20.5C18.75 20.9142 19.0858 21.25 19.5 21.25C19.9142 21.25 20.25 20.9142 20.25 20.5C20.25 17.8156 18.3912 15.7351 16.0713 14.8071C17.8514 13.4915 19 11.3799 19 9C19 5.13401 15.866 2 12 2ZM6.5 9C6.5 5.96243 8.96243 3.5 12 3.5C15.0376 3.5 17.5 5.96243 17.5 9C17.5 12.0376 15.0376 14.5 12 14.5C8.96243 14.5 6.5 12.0376 6.5 9Z" fill=""/>
              </svg>
            </div>
            <div>
              <p class="text-sm font-semibold text-gray-800 dark:text-white/90">Autenticação 2FA</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">Ativada via SMS/App</p>
            </div>
            <span class="ml-auto px-2.5 py-0.5 rounded-full bg-success-50 dark:bg-success-500/10 text-success-700 dark:text-success-400 text-xs font-semibold">Seguro</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bento boxes: Sessões e Log de Atividade -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Sessões Ativas -->
      <div class="flex items-start gap-4 p-5 border border-gray-200 rounded-2xl dark:border-gray-800 bg-white dark:bg-white/[0.03]">
        <div class="p-2.5 rounded-xl bg-brand-50 dark:bg-brand-500/10 text-brand-600 dark:text-brand-400 shrink-0">
          <svg class="fill-current w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M2 6C2 4.34315 3.34315 3 5 3H19C20.6569 3 22 4.34315 22 6V15C22 16.6569 20.6569 18 19 18H13.5V20H15.5C15.9142 20 16.25 20.3358 16.25 20.75C16.25 21.1642 15.9142 21.5 15.5 21.5H8.5C8.08579 21.5 7.75 21.1642 7.75 20.75C7.75 20.3358 8.08579 20 8.5 20H10.5V18H5C3.34315 18 2 16.6569 2 15V6ZM5 4.5C4.17157 4.5 3.5 5.17157 3.5 6V15C3.5 15.8284 4.17157 16.5 5 16.5H19C19.8284 16.5 20.5 15.8284 20.5 15V6C20.5 5.17157 19.8284 4.5 19 4.5H5Z" fill=""/>
          </svg>
        </div>
        <div>
          <h5 class="text-sm font-semibold text-gray-800 dark:text-white/90 mb-1">Sessões Ativas</h5>
          <p class="text-sm text-gray-500 dark:text-gray-400">2 dispositivos conectados à sua conta.</p>
          <button class="mt-3 text-sm font-medium text-brand-600 dark:text-brand-400 hover:underline">Ver detalhes</button>
        </div>
      </div>

      <!-- Log de Atividade -->
      <div class="flex items-start gap-4 p-5 border border-gray-200 rounded-2xl dark:border-gray-800 bg-white dark:bg-white/[0.03]">
        <div class="p-2.5 rounded-xl bg-warning-50 dark:bg-warning-500/10 text-warning-600 dark:text-warning-400 shrink-0">
          <svg class="fill-current w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.75C6.89137 2.75 2.75 6.89137 2.75 12C2.75 17.1086 6.89137 21.25 12 21.25C17.1086 21.25 21.25 17.1086 21.25 12C21.25 6.89137 17.1086 2.75 12 2.75ZM1.25 12C1.25 6.06294 6.06294 1.25 12 1.25C17.9371 1.25 22.75 6.06294 22.75 12C22.75 17.9371 17.9371 22.75 12 22.75C6.06294 22.75 1.25 17.9371 1.25 12ZM12 7.25C12.4142 7.25 12.75 7.58579 12.75 8V12C12.75 12.4142 12.4142 12.75 12 12.75C11.5858 12.75 11.25 12.4142 11.25 12V8C11.25 7.58579 11.5858 7.25 12 7.25ZM12 14.5C11.5858 14.5 11.25 14.8358 11.25 15.25V15.75C11.25 16.1642 11.5858 16.5 12 16.5C12.4142 16.5 12.75 16.1642 12.75 15.75V15.25C12.75 14.8358 12.4142 14.5 12 14.5Z" fill=""/>
          </svg>
        </div>
        <div>
          <h5 class="text-sm font-semibold text-gray-800 dark:text-white/90 mb-1">Log de Atividade</h5>
          <p class="text-sm text-gray-500 dark:text-gray-400">Veja as últimas ações realizadas no sistema.</p>
          <button class="mt-3 text-sm font-medium text-warning-600 dark:text-warning-400 hover:underline">Aceder ao Log</button>
        </div>
      </div>
    </div>

  </div>
</div>
