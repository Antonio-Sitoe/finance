<app-datatable
  [store]="facade.list"
  [syncUrl]="true"
  [columns]="columns"
  [rowTemplate]="contactRow"
  [filtersTemplate]="contactFilters"
/>

<ng-template #contactFilters>
  <div
    class="flex flex-col gap-3 border-b border-gray-100 px-5 py-4 sm:flex-row sm:items-center sm:justify-between dark:border-white/[0.05]"
  >
    <div class="flex items-center gap-3">
      <span class="text-brand-500">
        <ng-container solarIcon="UsersGroupRoundedBold" [size]="20" />
      </span>
      <div>
        <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">
          Contactos
        </h3>
        <p class="text-xs text-gray-500 dark:text-gray-400">
          {{ facade.list.total() }}
          contacto{{ facade.list.total() !== 1 ? "s" : "" }}
        </p>
      </div>
    </div>
    <button
      (click)="openCreateDrawer()"
      class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-brand-600"
    >
      <ng-container solarIcon="UserPlusBold" [size]="16" />
      Novo Contacto
    </button>
  </div>
  <div
    class="flex flex-col gap-3 border-b border-gray-100 px-5 py-4 sm:flex-row sm:items-center dark:border-white/[0.05]"
  >
    <div class="relative flex-1">
      <span
        class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-400"
      >
        <ng-container solarIcon="MagnifierBold" [size]="16" />
      </span>
      <app-input-field
        placeholder="Filtrar por nome..."
        className="pl-9"
        [value]="facade.searchTerm()"
        (valueChange)="facade.search($event.toString())"
      />
    </div>
    <app-select
      placeholder="Todos os estados"
      [options]="facade.situacaoOptions"
      [value]="facade.filterSituacao()"
      (valueChange)="facade.filterBySituacao($event)"
      className="w-full sm:w-44"
    />
  </div>
</ng-template>

<ng-template #contactRow let-row>
  <tr class="hover:bg-gray-50 dark:hover:bg-white/[0.02]">
    <td class="px-5 py-3.5">
      <div class="flex items-center gap-3">
        <app-avatar-text [name]="row.nome" />
        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">
          {{ row.nome }}
        </span>
      </div>
    </td>

    <td class="px-5 py-3.5 text-sm text-gray-600 dark:text-gray-400">
      {{ row.departamento ?? "—" }}
    </td>

    <td class="px-5 py-3.5 text-sm text-gray-600 dark:text-gray-400">
      {{ row.telefone }}
    </td>

    <td class="px-5 py-3.5 text-sm text-gray-600 dark:text-gray-400">
      {{ row.email }}
    </td>

    <td class="px-5 py-3.5">
      <div class="flex items-center justify-center">
        <app-badge
          variant="light"
          [color]="row.situacao === 'ATIVO' ? 'success' : 'error'"
          size="sm"
        >
          {{ row.situacao === "ATIVO" ? "Ativo" : "Inativo" }}
        </app-badge>
      </div>
    </td>

    <td class="px-5 py-3.5">
      <div class="flex items-center justify-end gap-1">
        <button
          title="Ver detalhes"
          (click)="openDetailDrawer(row)"
          class="flex h-8 w-8 items-center justify-center rounded text-gray-400 transition-colors hover:bg-brand-50 hover:text-brand-500 dark:hover:bg-brand-500/10"
        >
          <ng-container solarIcon="EyeBold" [size]="18" />
        </button>
      </div>
    </td>
  </tr>
</ng-template>

@if (drawerOpen()) {
  <app-create-and-edit-contact
    [open]="drawerOpen()"
    [contact]="selectedContact()"
    [lockedClienteId]="facade.cliente()?.id ?? null"
    [lockedClienteNome]="facade.cliente()?.nomeEmpresarial ?? null"
    (openChange)="onDrawerClose($event)"
  />
}

@if (detailDrawerOpen()) {
  <app-contact-detail-drawer
    [open]="detailDrawerOpen()"
    [contact]="selectedContact()"
    (openChange)="detailDrawerOpen.set($event)"
    (edit)="openEditDrawer($event)"
    (situacaoChange)="facade.refresh()"
  />
}
