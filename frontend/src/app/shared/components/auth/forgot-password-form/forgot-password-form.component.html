<div class="w-full max-w-[440px]">

  @if (!isSubmitted) {

    <!-- Estado inicial: formulário -->
    <div class="mb-8">
      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white/90 mb-2">
        Recuperar Password
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Introduza o seu email para receber as instruções de recuperação.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">

      <!-- Campo Email -->
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">
          Endereço de Email
        </label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
            <ng-container [solarIcon]="LetterLineDuotone" [size]="18" />
          </span>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="exemplo@finance.corp"
            required
            class="h-11 w-full pl-10 pr-4 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder:text-gray-400 bg-transparent focus:outline-none focus:ring-3 focus:border-brand-300 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
          />
        </div>
      </div>

      <!-- Botão enviar -->
      <app-button
        className="w-full"
        size="sm"
        [loading]="isLoading"
        (btnClick)="onSubmit()"
      >
        Enviar instruções
      </app-button>

    </form>

    <!-- Link voltar ao login -->
    <div class="mt-8 flex justify-center">
      <a
        routerLink="/signin"
        class="inline-flex items-center gap-2 text-sm text-brand-500 hover:text-brand-600 dark:text-brand-400 font-medium transition-colors"
      >
        <ng-container [solarIcon]="AltArrowLeftLineDuotone" [size]="16" />
        Voltar ao login
      </a>
    </div>

  } @else {

    <!-- Estado de sucesso -->
    <div class="flex flex-col items-center text-center">
      <div class="w-20 h-20 rounded-full bg-brand-50 dark:bg-brand-500/10 flex items-center justify-center mb-6 text-brand-500">
        <ng-container [solarIcon]="CheckCircleBold" [size]="40" />
      </div>

      <h1 class="text-2xl font-semibold text-gray-800 dark:text-white/90 mb-3">
        Email Enviado!
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-8 max-w-sm">
        Enviámos um link de recuperação para <strong class="text-gray-700 dark:text-gray-300">{{ email }}</strong>.
        Por favor verifique a sua caixa de entrada.
      </p>

      <div class="w-full space-y-3">
        <button
          type="button"
          (click)="resend()"
          class="w-full h-11 rounded-lg border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5 transition-colors"
        >
          Não recebeu o email? Reenviar
        </button>
        <a
          routerLink="/signin"
          class="block w-full text-center text-sm text-brand-500 hover:text-brand-600 dark:text-brand-400 font-medium py-2"
        >
          Voltar ao login
        </a>
      </div>
    </div>

  }

</div>
