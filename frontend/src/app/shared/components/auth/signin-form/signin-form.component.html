<div class="w-full max-w-[440px]">

  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-white/90 mb-2">
      Bem-vindo de volta
    </h1>
    <p class="text-sm text-gray-500 dark:text-gray-400">
      Inicie sessão na sua conta
    </p>
  </div>

  <!-- Alerta de erro -->
  @if (hasError) {
    <div class="flex items-center gap-3 p-4 mb-6 bg-error-50 dark:bg-error-500/10 rounded-xl border border-error-200 dark:border-error-500/20">
      <span class="text-error-500 flex-shrink-0">
        <ng-container [solarIcon]="DangerCircleBold" [size]="20" />
      </span>
      <span class="text-sm text-error-700 dark:text-error-400">
        Credenciais inválidas. Por favor tente novamente.
      </span>
    </div>
  }

  <!-- Formulário -->
  <form (ngSubmit)="onSignIn()" class="space-y-5">

    <!-- Campo Email -->
    <div class="space-y-1.5">
      <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">
        Email <span class="text-error-500">*</span>
      </label>
      <div class="relative">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
          <ng-container [solarIcon]="LetterLineDuotone" [size]="18" />
        </span>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="exemplo@finance.corp"
          required
          class="h-11 w-full pl-10 pr-4 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder:text-gray-400 bg-transparent focus:outline-none focus:ring-3 focus:border-brand-300 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
      </div>
    </div>

    <!-- Campo Password -->
    <div class="space-y-1.5">
      <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 uppercase tracking-wider">
        Password <span class="text-error-500">*</span>
      </label>
      <div class="relative">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
          <ng-container [solarIcon]="LockKeyholeLineDuotone" [size]="18" />
        </span>
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          class="h-11 w-full pl-10 pr-11 rounded-lg border border-gray-300 text-sm text-gray-800 placeholder:text-gray-400 bg-transparent focus:outline-none focus:ring-3 focus:border-brand-300 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors"
        >
          @if (showPassword) {
            <ng-container [solarIcon]="EyeClosedLineDuotone" [size]="18" />
          } @else {
            <ng-container [solarIcon]="EyeLineDuotone" [size]="18" />
          }
        </button>
      </div>
    </div>

    <!-- Manter sessão + Esqueceu a password -->
    <div class="flex items-center justify-between">
      <app-checkbox
        [(checked)]="isChecked"
        label="Manter sessão iniciada"
      />
      <a
        routerLink="/forgot-password"
        class="text-sm text-brand-500 hover:text-brand-600 dark:text-brand-400 font-medium"
      >
        Esqueceu a password?
      </a>
    </div>

    <!-- Botão de submissão -->
    <app-button
      className="w-full"
      size="sm"
      [loading]="isLoading"
      (btnClick)="onSignIn()"
    >
      Entrar
    </app-button>

  </form>

</div>
