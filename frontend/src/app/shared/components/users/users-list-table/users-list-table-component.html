<app-datatable
  [columns]="facade.columns"
  [data]="facade.list.items()"
  [rowTemplate]="userRow"
  [filtersTemplate]="userFilters"
  [currentPage]="facade.list.query().page"
  [totalPages]="facade.list.totalPages()"
  [totalElements]="facade.list.total()"
  [rowsPerPage]="facade.list.query().size"
  (nextPage)="facade.list.nextPage()"
  (previousPage)="facade.list.previousPage()"
  [loading]="facade.list.loading()"
/>

<ng-template #userFilters>
  <div
    class="flex flex-col gap-3 border-b border-gray-100 px-5 py-4 sm:flex-row sm:items-center dark:border-white/[0.05]"
  >
    <div class="relative flex-1">
      <span
        class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-400"
      >
        <ng-container [solarIcon]="MagnifierBold" [size]="16" />
      </span>
      <app-input-field
        placeholder="Pesquisar por nome ou email..."
        className="pl-9"
        [value]="facade.searchTerm()"
        (valueChange)="facade.search($event.toString())"
      />
    </div>
    <app-select
      placeholder="Todos os estados"
      [options]="facade.statusOptions"
      [value]="facade.filterStatus()"
      (valueChange)="facade.filterBySituacao($event)"
      className="w-full sm:w-44"
    />
    <app-select
      placeholder="Todas as funções"
      [options]="facade.roleOptions"
      [value]="facade.filterRole()"
      (valueChange)="facade.filterByPerfil($event)"
      className="w-full sm:w-44"
    />
  </div>
</ng-template>

<ng-template #userRow let-row>
  <tr class="hover:bg-gray-50 dark:hover:bg-white/[0.02]">
    <td class="px-5 py-3.5">
      <div class="flex items-center gap-3">
        <app-checkbox
          [checked]="facade.selectedRows().includes(row.id)"
          (checkedChange)="facade.toggleRowSelect(row.id)"
        />
        <app-avatar-text [name]="row.nome" />
        <div>
          <span
            class="block text-sm font-medium text-gray-700 dark:text-gray-300"
          >
            {{ row.nome }}
          </span>
          <span class="text-xs text-gray-500 dark:text-gray-400">
            {{ row.email }}
          </span>
        </div>
      </div>
    </td>
    <td class="px-5 py-3.5 text-xs text-gray-600 dark:text-gray-400">
      {{ row.perfil | profile }}
    </td>
    <td class="px-5 py-3.5 mx-auto">
      <div class="flex items-center justify-center">
        <app-badge
          variant="light"
          [color]="facade.badgeColor(row.situacao)"
          size="sm"
        >
          {{ row.situacao | situation }}
        </app-badge>
      </div>
    </td>
    <td class="px-5 py-3.5 text-sm text-gray-500 dark:text-gray-400">
      {{ row.createdAt | date:'dd \'de\' MMMM \'de\' yyyy' }}
    </td>
    <td class="px-5 py-3.5">
      <div class="flex items-center justify-end gap-4">
        <button
          (click)="openEdit(row)"
          class="text-gray-400 w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 dark:hover:bg-gray-800"
        >
          <ng-container [solarIcon]="Pen2Bold" [size]="18" />
        </button>

        <button
          class="text-gray-400 hover:text-error-500 dark:hover:text-error-400 w-8 h-8 flex items-center justify-center rounded"
          (click)="openDetail(row)"
        >
          <ng-container [solarIcon]="EyeBold" [size]="18" />
        </button>
      </div>
    </td>
  </tr>
</ng-template>

@if (drawerOpen()) {
<app-create-and-edit-user
  [open]="drawerOpen()"
  (openChange)="drawerOpen.set($event)"
/>
} @if (detailDrawerOpen()) {
<app-user-detail-drawer
  [open]="detailDrawerOpen()"
  [user]="selectedUser()"
  (openChange)="detailDrawerOpen.set($event)"
  (edit)="openEdit($event)"
/>
}
