<div class="flex flex-col gap-4">
  <!-- Campo de pesquisa -->
  <div class="relative">
    <span
      class="pointer-events-none absolute inset-y-0 left-4 flex items-center text-gray-400 dark:text-gray-500"
    >
      <ng-container [solarIcon]="'MagnifierBold'" [size]="20" />
    </span>
    <input
      type="text"
      [value]="query"
      (input)="onInput($event)"
      placeholder="Pesquisar clientes, fornecedores ou lançamentos..."
      class="h-12 w-full rounded-xl border border-gray-200 bg-white pl-12 pr-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-none focus:ring-3 focus:ring-brand-500/10 dark:border-gray-800 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-gray-500"
    />
  </div>

  <!-- Tabs -->
  <app-global-search-tabs
    [active]="activeTab"
    [counts]="counts"
    (tabChange)="tabChange.emit($event)"
  />
</div>
