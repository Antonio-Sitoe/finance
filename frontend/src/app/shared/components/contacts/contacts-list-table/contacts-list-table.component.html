<app-datatable
  [store]="facade.list"
  [syncUrl]="true"
  [columns]="columns"
  [rowTemplate]="contactRow"
  [filtersTemplate]="contactFilters"
/>

<ng-template #contactFilters>
  <div
    class="flex flex-col gap-3 border-b border-gray-100 px-5 py-4 sm:flex-row sm:items-center dark:border-white/[0.05]"
  >
    <div class="relative flex-1">
      <span
        class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-400"
      >
        <ng-container [solarIcon]="MagnifierBold" [size]="16" />
      </span>
      <app-input-field
        placeholder="Pesquisar por nome ou email..."
        className="pl-9"
        [value]="facade.searchTerm()"
        (valueChange)="facade.search($event.toString())"
      />
    </div>
    <app-select
      placeholder="Todos os departamentos"
      [options]="facade.departamentoOptions"
      [value]="facade.filterDepartamento()"
      (valueChange)="facade.filterByDepartamento($event)"
      className="w-full sm:w-52"
    />
    <app-select
      placeholder="Todos os estados"
      [options]="facade.situacaoOptions"
      [value]="facade.filterSituacao()"
      (valueChange)="facade.filterBySituacao($event)"
      className="w-full sm:w-44"
    />
  </div>
</ng-template>

<ng-template #contactRow let-row>
  <tr class="hover:bg-gray-50 dark:hover:bg-white/[0.02]">
    <td class="px-5 py-3.5">
      <div class="flex items-center gap-3">
        <app-checkbox />
        <app-avatar-text [name]="row.nome" />
        <div>
          <span class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            {{ row.nome }}
          </span>
          <span class="block text-xs text-gray-500 dark:text-gray-400">
            {{ row.email }}
          </span>
        </div>
      </div>
    </td>

    <td class="px-5 py-3.5">
      @if (row.departamento) {
        <span
          class="inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-700 dark:bg-white/[0.05] dark:text-gray-300"
        >
          {{ row.departamento }}
        </span>
      } @else {
        <span class="text-xs text-gray-400">—</span>
      }
    </td>

    <td class="px-5 py-3.5 text-sm text-gray-600 dark:text-gray-400">
      {{ row.telefone ?? '—' }}
    </td>

    <td class="px-5 py-3.5">
      @if (row.clienteNome) {
        <div class="flex items-center gap-2">
          <span
            class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-brand-50 text-[10px] font-bold text-brand-600 dark:bg-brand-500/10 dark:text-brand-400"
          >
            {{ getEmpresaInitials(row.clienteNome) }}
          </span>
          <span class="text-sm text-gray-700 dark:text-gray-300">{{ row.clienteNome }}</span>
        </div>
      } @else {
        <span class="text-xs text-gray-400">—</span>
      }
    </td>

    <td class="px-5 py-3.5">
      <div class="flex items-center justify-center">
        <app-badge
          variant="light"
          [color]="facade.badgeColor(row.situacao)"
          size="sm"
        >
          {{ row.situacao === 'ATIVO' ? 'Ativo' : 'Inativo' }}
        </app-badge>
      </div>
    </td>

    <td class="px-5 py-3.5">
      <div class="flex items-center justify-end gap-1">
        <button
          (click)="detailClick.emit(row)"
          title="Ver detalhes"
          class="text-gray-400 w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
        >
          <ng-container [solarIcon]="EyeBold" [size]="18" />
        </button>
        <button
          (click)="editClick.emit(row)"
          title="Editar"
          class="text-gray-400 w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
        >
          <ng-container [solarIcon]="Pen2Bold" [size]="18" />
        </button>
      </div>
    </td>
  </tr>
</ng-template>
