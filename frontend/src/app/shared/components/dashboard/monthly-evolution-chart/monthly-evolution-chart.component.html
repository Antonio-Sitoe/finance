<div
  class="flex h-full flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white px-5 pt-5 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6 sm:pt-6"
>
  <div
    class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
  >
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Evolução — Últimos Meses
    </h3>
    <div class="flex gap-4">
      <div class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-success-500"></span>
        <span class="text-theme-xs text-gray-500 dark:text-gray-400"
          >Receitas</span
        >
      </div>
      <div class="flex items-center gap-2">
        <span class="h-3 w-3 rounded-full bg-error-500"></span>
        <span class="text-theme-xs text-gray-500 dark:text-gray-400"
          >Despesas</span
        >
      </div>
    </div>
  </div>

  <div class="min-h-[320px] w-full flex-1">
    @if (hasChartData()) {
      <div class="h-full w-full">
        <apx-chart
          [series]="series()"
          [chart]="chart"
          [xaxis]="xaxis()"
          [plotOptions]="plotOptions"
          [dataLabels]="dataLabels"
          [stroke]="stroke"
          [legend]="legend"
          [yaxis]="yaxis"
          [grid]="grid"
          [fill]="fill"
          [tooltip]="tooltip"
          [colors]="colors"
        ></apx-chart>
      </div>
    } @else {
      <div
        class="flex h-64 items-center justify-center text-theme-sm text-gray-400 dark:text-gray-500"
      >
        Nenhum dado disponível
      </div>
    }
  </div>
</div>
