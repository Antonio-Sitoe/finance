<div
  class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-6 md:gap-5"
>
  @for (card of metricCards(); track card.label) {
    <div
      class="group relative overflow-hidden rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-xs transition-shadow hover:shadow-theme-md dark:border-gray-800 dark:bg-white/[0.03]"
    >
      <div class="flex items-start justify-between gap-3">
        <p
          class="text-theme-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400 leading-snug"
        >
          {{ card.label }}
        </p>
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl transition-transform group-hover:scale-105"
          [class]="accentIconClasses[card.accent]"
        >
          <ng-container [solarIcon]="card.icon" [size]="22" />
        </div>
      </div>
      <p
        class="mt-4 text-lg font-bold tabular-nums leading-tight text-gray-800 dark:text-white/90 sm:text-xl"
      >
        {{ card.value() }}
      </p>
    </div>
  }
</div>

<div class="grid grid-cols-1 mt-4 gap-4 sm:grid-cols-3 md:gap-5">
  @for (card of alertCards(); track card.label) {
    <div
      class="group relative overflow-hidden rounded-2xl border border-gray-200 border-l-4 bg-white p-5 shadow-theme-xs transition-shadow hover:shadow-theme-md dark:border-gray-800 dark:bg-white/[0.03]"
      [class]="accentBorderClasses[card.accent]"
    >
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0 flex-1">
          <p
            class="text-theme-xs font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400"
          >
            {{ card.label }}
          </p>
          <p
            class="mt-3 text-lg font-bold tabular-nums leading-tight text-gray-800 dark:text-white/90 sm:text-xl"
          >
            {{ card.value() }}
          </p>
        </div>
        <div class="flex flex-col items-end gap-2">
          <div
            class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl transition-transform group-hover:scale-105 [&_svg]:size-[22px]"
            [class]="accentIconClasses[card.accent]"
            [innerHTML]="card.iconHtml | safeHtml"
          ></div>
          <app-badge [color]="card.badgeColor" size="sm">
            {{ card.badgeText }}
          </app-badge>
        </div>
      </div>
    </div>
  }
</div>
