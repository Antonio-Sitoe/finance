<div class="border border-gray-200 rounded-2xl dark:border-gray-800 overflow-hidden bg-white dark:bg-white/[0.03]">
  <!-- Cabeçalho -->
  <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-800">
    <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">Morada</h4>
    <button
      (click)="openModal()"
      class="flex items-center gap-1.5 text-sm font-medium text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 transition-colors"
    >
      <svg class="fill-current w-4 h-4" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M15.0911 2.78206C14.2125 1.90338 12.7878 1.90338 11.9092 2.78206L4.57524 10.116C4.26682 10.4244 4.0547 10.8158 3.96468 11.2426L3.31231 14.3352C3.25997 14.5833 3.33653 14.841 3.51583 15.0203C3.69512 15.1996 3.95286 15.2761 4.20096 15.2238L7.29355 14.5714C7.72031 14.4814 8.11172 14.2693 8.42013 13.9609L15.7541 6.62695C16.6327 5.74827 16.6327 4.32365 15.7541 3.44497L15.0911 2.78206ZM12.9698 3.84272C13.2627 3.54982 13.7376 3.54982 14.0305 3.84272L14.6934 4.50563C14.9863 4.79852 14.9863 5.2734 14.6934 5.56629L14.044 6.21573L12.3204 4.49215L12.9698 3.84272ZM11.2597 5.55281L5.6359 11.1766C5.53309 11.2794 5.46238 11.4099 5.43238 11.5522L5.01758 13.5185L6.98394 13.1037C7.1262 13.0737 7.25666 13.003 7.35947 12.9002L12.9833 7.27639L11.2597 5.55281Z" fill=""/>
      </svg>
      Editar
    </button>
  </div>

  <!-- Grid de campos -->
  <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="space-y-1">
      <p class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider">País</p>
      <p class="text-sm font-medium text-gray-800 dark:text-white/90">{{ address.country }}</p>
    </div>
    <div class="space-y-1">
      <p class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider">Cidade / Estado</p>
      <p class="text-sm font-medium text-gray-800 dark:text-white/90">{{ address.cityState }}</p>
    </div>
    <div class="space-y-1">
      <p class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider">Código Postal</p>
      <p class="text-sm font-medium text-gray-800 dark:text-white/90">{{ address.postalCode }}</p>
    </div>
    <div class="space-y-1">
      <p class="text-xs font-medium text-gray-400 dark:text-gray-500 uppercase tracking-wider">NIF / TAX ID</p>
      <p class="text-sm font-medium text-gray-800 dark:text-white/90">{{ address.taxId }}</p>
    </div>
  </div>
</div>

<!-- Modal de edição -->
<app-modal
  [isOpen]="isOpen"
  (close)="closeModal()"
  className="max-w-[700px] m-4"
>
  <div class="relative w-full p-4 overflow-y-auto bg-white no-scrollbar rounded-3xl dark:bg-gray-900 lg:p-11">
    <div class="px-2 pr-14">
      <h4 class="mb-2 text-2xl font-semibold text-gray-800 dark:text-white/90">
        Editar Morada
      </h4>
      <p class="mb-6 text-sm text-gray-500 dark:text-gray-400 lg:mb-7">
        Atualize os seus dados para manter o perfil atualizado.
      </p>
    </div>
    <form class="flex flex-col" (ngSubmit)="handleSave()">
      <div class="px-2 overflow-y-auto custom-scrollbar">
        <div class="grid grid-cols-1 gap-x-6 gap-y-5 lg:grid-cols-2">
          <div>
            <app-label>País</app-label>
            <app-input-field type="text" [value]="address.country" />
          </div>
          <div>
            <app-label>Cidade / Estado</app-label>
            <app-input-field type="text" [value]="address.cityState" />
          </div>
          <div>
            <app-label>Código Postal</app-label>
            <app-input-field type="text" [value]="address.postalCode" />
          </div>
          <div>
            <app-label>NIF / TAX ID</app-label>
            <app-input-field type="text" [value]="address.taxId" />
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3 px-2 mt-6 lg:justify-end">
        <app-button size="sm" variant="outline" (btnClick)="closeModal()">Cancelar</app-button>
        <app-button size="sm" (btnClick)="handleSave()">Guardar</app-button>
      </div>
    </form>
  </div>
</app-modal>
