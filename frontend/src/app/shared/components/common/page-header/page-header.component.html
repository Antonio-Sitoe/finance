<div class="mb-6 flex flex-col items-start justify-between gap-4">
  <div>
    @if (breadcrumbs().length) {
      <nav
        class="mb-2 flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400"
      >
        @for (crumb of breadcrumbs(); track crumb.label; let last = $last) {
          @if (crumb.path && !last) {
            <a
              [routerLink]="crumb.path"
              class="hover:text-gray-700 dark:hover:text-gray-200"
            >
              {{ crumb.label }}
            </a>
          } @else {
            <span
              [class.text-gray-800]="last"
              [class.dark:text-white]="last"
              [class.font-medium]="last"
            >
              {{ crumb.label }}
            </span>
          }
          @if (!last) {
            <span class="select-none">›</span>
          }
        }
      </nav>
    }
  </div>

  <section class="flex w-full items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-white/90">
        {{ title() }}
      </h1>
      @if (description()) {
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          {{ description() }}
        </p>
      }
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <ng-content />
    </div>
  </section>
</div>
