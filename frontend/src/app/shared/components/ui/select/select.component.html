<div class="relative {{ className }}" (click)="$event.stopPropagation()">
  <button
    type="button"
    (click)="toggle()"
    class="flex h-11 w-full items-center justify-between gap-2 rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:focus:border-brand-800"
  >
    <span
      class="truncate"
      [class]="selectedLabel ? 'text-gray-800 dark:text-white/90' : 'text-gray-400 dark:text-gray-500'"
    >
      {{ selectedLabel || placeholder }}
    </span>
    <svg
      class="shrink-0 text-gray-400 transition-transform duration-150 dark:text-gray-500"
      [class.rotate-180]="isOpen()"
      width="16"
      height="16"
      viewBox="0 0 16 16"
      fill="none"
    >
      <path
        d="M4 6l4 4 4-4"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (isOpen()) {
    <div
      class="absolute left-0 z-50 mt-1 w-full overflow-hidden rounded-xl border border-gray-200 bg-white py-1 shadow-lg dark:border-white/[0.08] dark:bg-gray-900"
    >
      @for (option of options; track option.value) {
        <button
          type="button"
          (click)="select(option)"
          class="flex w-full items-center px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-50 dark:text-gray-300 dark:hover:bg-white/[0.04]"
          [class.font-medium]="value === option.value"
          [class.text-brand-600]="value === option.value"
          [class.dark:text-brand-400]="value === option.value"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
