<!-- Backdrop -->
<div
  class="fixed inset-0 z-99999 bg-gray-400/30 backdrop-blur-sm transition-opacity duration-300"
  [class.opacity-0]="!open"
  [class.pointer-events-none]="!open"
  (click)="close()"
></div>

<!-- Drawer panel -->
<div
  class="fixed inset-y-0 right-0 z-999999 flex w-full flex-col bg-white shadow-2xl transition-transform duration-300 ease-in-out dark:bg-gray-900"
  [class.translate-x-full]="!open"
  [class.max-w-sm]="size === 'sm'"
  [class.max-w-md]="size === 'md'"
  [class.max-w-2xl]="size === 'lg'"
>
  <!-- Header -->
  <div
    class="flex shrink-0 items-center justify-between border-b border-gray-100 px-6 py-4 dark:border-white/[0.08]"
  >
    <div class="flex flex-col gap-0.5">
      <ng-content select="[drawer-header]" />
    </div>
    <button
      type="button"
      (click)="close()"
      class="flex h-9 w-9 items-center justify-center rounded-full bg-gray-100 text-gray-400 transition-colors hover:bg-gray-200 hover:text-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M6.04289 16.5413C5.65237 16.9318 5.65237 17.565 6.04289 17.9555C6.43342 18.346 7.06658 18.346 7.45711 17.9555L11.9987 13.4139L16.5408 17.956C16.9313 18.3466 17.5645 18.3466 17.955 17.956C18.3455 17.5655 18.3455 16.9323 17.955 16.5418L13.4129 11.9997L17.955 7.4576C18.3455 7.06707 18.3455 6.43391 17.955 6.04338C17.5645 5.65286 16.9313 5.65286 16.5408 6.04338L11.9987 10.5855L7.45711 6.0439C7.06658 5.65338 6.43342 5.65338 6.04289 6.0439C5.65237 6.43442 5.65237 7.06759 6.04289 7.45811L10.5845 11.9997L6.04289 16.5413Z"
          fill="currentColor"
        />
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="flex-1 overflow-y-auto px-6 py-5">
    <ng-content />
  </div>

  <!-- Footer (opcional via [showFooter]="true") -->
  @if (showFooter) {
    <div
      class="shrink-0 border-t border-gray-100 px-6 py-4 dark:border-white/[0.08]"
    >
      <ng-content select="[drawer-footer]" />
    </div>
  }
</div>
