<div class="flex min-h-screen">
  <!-- Painel esquerdo: branding com gradiente verde -->
  <section
    class="hidden lg:flex lg:w-[40%] flex-col justify-between p-12 relative overflow-hidden"
    style="background: linear-gradient(135deg, #006c49 0%, #00422b 100%)"
  >
    <!-- Efeitos decorativos -->
    <div
      class="absolute -top-24 -left-24 w-96 h-96 bg-white/10 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute -bottom-24 -right-24 w-96 h-96 bg-white/10 rounded-full blur-3xl pointer-events-none"
    ></div>

    <!-- Logo -->
    <div class="relative z-10 flex items-center gap-3">
      <div
        class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-lg flex-shrink-0"
      >
        <span class="text-[#006c49]">
          <ng-container [solarIcon]="BuildingsBold" [size]="20" />
        </span>
      </div>
      <span class="text-white font-bold text-xl tracking-tight"
        >FinanceApp</span
      >
    </div>

    <!-- Conteúdo central -->
    <div class="relative z-10 space-y-8">
      <h2 class="text-white font-bold text-3xl leading-tight">
        Gestão financeira inteligente para a sua empresa
      </h2>
      <ul class="space-y-4">
        <li class="flex items-center gap-3">
          <span
            class="flex-shrink-0 w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-white"
          >
            <ng-container [solarIcon]="CheckCircleBold" [size]="16" />
          </span>
          <span class="text-white/90 text-sm font-medium"
            >Controlo de receitas e despesas</span
          >
        </li>
        <li class="flex items-center gap-3">
          <span
            class="flex-shrink-0 w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-white"
          >
            <ng-container [solarIcon]="CheckCircleBold" [size]="16" />
          </span>
          <span class="text-white/90 text-sm font-medium"
            >Relatórios em tempo real</span
          >
        </li>
        <li class="flex items-center gap-3">
          <span
            class="flex-shrink-0 w-7 h-7 rounded-full bg-white/20 flex items-center justify-center text-white"
          >
            <ng-container [solarIcon]="CheckCircleBold" [size]="16" />
          </span>
          <span class="text-white/90 text-sm font-medium"
            >Gestão de clientes e fornecedores</span
          >
        </li>
      </ul>
    </div>

    <!-- Footer -->
    <div class="relative z-10">
      <p class="text-white/40 text-xs font-medium uppercase tracking-widest">
        © 2024 FinanceApp. Institutional Trust &amp; Precision.
      </p>
    </div>
  </section>

  <!-- Painel direito: área do formulário -->
  <section
    class="w-full lg:w-[60%] flex items-center justify-center bg-white dark:bg-gray-900 min-h-screen p-6 sm:p-10"
  >
    <ng-content></ng-content>
  </section>

  <!-- Dark mode toggle -->
  <div class="fixed z-50 bottom-6 right-6 hidden sm:block">
    <app-theme-toggle-two />
  </div>
</div>
