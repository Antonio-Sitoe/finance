<header
  class="sticky top-0 flex w-full bg-white border-gray-200 z-9999 dark:border-gray-800 dark:bg-gray-900 xl:border-b"
>
  <div
    class="flex flex-col items-center justify-between grow xl:flex-row xl:px-6"
  >
    <div
      class="flex items-center justify-between w-full gap-2 px-3 py-3 border-b border-gray-200 dark:border-gray-800 sm:gap-4 xl:justify-normal xl:border-b-0 xl:px-0 lg:py-4"
    >
      <button
        class="items-center justify-center w-10 h-10 text-gray-500 border-gray-200 rounded-lg z-99999 dark:border-gray-800 flex dark:text-gray-400 lg:h-11 lg:w-11 xl:border"
        [ngClass]="{
          'bg-gray-100 dark:bg-white/[0.03]': isMobileOpen$ | async,
        }"
        (click)="handleToggle()"
        aria-label="Toggle Sidebar"
      >
        @if (isMobileOpen$ | async) {
          <ng-container [solarIcon]="CloseCircleBold" [size]="24" />
        } @else {
          <ng-container [solarIcon]="HamburgerMenuBold" [size]="24" />
        }
      </button>
      <!-- Logo (placeholder) -->
      <a routerLink="/" class="xl:hidden">
        <img class="dark:hidden" src="/images/logo/logo.svg" alt="Logo" />
        <img
          class="hidden dark:block"
          src="/images/logo/logo-dark.svg"
          alt="Logo"
        />
      </a>
      <button
        (click)="toggleApplicationMenu()"
        class="flex items-center justify-center w-10 h-10 text-gray-700 rounded-lg z-99999 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 xl:hidden"
      >
        <ng-container [solarIcon]="MenuDotsBold" [size]="24" />
      </button>
      <!-- Botão que parece um input — abre o command palette de pesquisa -->
      <div class="hidden xl:block">
        <button
          type="button"
          (click)="search.openModal()"
          aria-label="Abrir pesquisa global"
          class="dark:bg-dark-900 relative flex h-11 w-full items-center rounded-lg border border-gray-200 bg-transparent py-2.5 pl-12 pr-14 text-sm text-gray-400 shadow-theme-xs transition-colors hover:border-brand-300 dark:border-gray-800 dark:bg-white/[0.03] dark:text-white/30 dark:hover:border-brand-800 xl:w-[430px]"
        >
          <span
            class="absolute -translate-y-1/2 pointer-events-none left-4 top-1/2 text-gray-500 dark:text-gray-400"
          >
            <ng-container [solarIcon]="MagnifierBold" [size]="20" />
          </span>
          <span>Pesquisar ou escrever comando...</span>
          <span
            class="absolute right-2.5 top-1/2 inline-flex -translate-y-1/2 items-center gap-0.5 rounded-lg border border-gray-200 bg-gray-50 px-[7px] py-[4.5px] text-xs -tracking-[0.2px] text-gray-500 dark:border-gray-800 dark:bg-white/[0.03] dark:text-gray-400"
          >
            <span> ⌘ </span>
            <span> K </span>
          </span>
        </button>
      </div>

      <!-- Ícone de pesquisa (mobile) -->
      <button
        type="button"
        (click)="search.openModal()"
        aria-label="Abrir pesquisa global"
        class="flex items-center justify-center w-10 h-10 text-gray-700 rounded-lg hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800 xl:hidden"
      >
        <ng-container [solarIcon]="MagnifierBold" [size]="24" />
      </button>
    </div>
    <div
      [ngClass]="isApplicationMenuOpen ? 'flex' : 'hidden'"
      class="items-center justify-between w-full gap-4 px-5 py-4 xl:flex shadow-theme-md xl:justify-end xl:px-0 xl:shadow-none"
    >
      <div class="flex items-center gap-2 2xsm:gap-3">
        <!-- ThemeToggleButton placeholder -->
        <app-theme-toggle-button />
        <!-- NotificationDropdown placeholder -->
        <app-notification-dropdown />
      </div>
      <!-- UserDropdown placeholder -->
      <app-user-dropdown />
    </div>
  </div>
</header>
