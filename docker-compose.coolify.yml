# Coolify: Build Pack = Docker Compose
# Docker Compose Location = /docker-compose.coolify.yml
#
# Só o frontend fica público (porta 80 no contentor).
# O proxy do Coolify trata HTTPS; o nginx faz proxy de /api → backend:8081.
# Não uses `ports:` aqui — o Coolify já ocupa 80/443 no servidor.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      FRONTEND_URL: ${FRONTEND_URL:-${SERVICE_URL_FRONTEND}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${SERVICE_URL_FRONTEND}}
      SWAGGER_ENABLED: "false"
      JPA_SHOW_SQL: "false"
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: /api
    restart: unless-stopped
    environment:
      # Gera o domínio público e diz ao proxy para usar a porta 80 do contentor
      SERVICE_URL_FRONTEND: /
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
